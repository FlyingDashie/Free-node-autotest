name: 终止现有并新跑一个

on:
  workflow_dispatch:
    inputs:
      extra_env:
        description: "Extra env vars, one KEY=VALUE per line"
        required: false
        default: ""
        type: string

concurrency:
  group: autotest-clash
  cancel-in-progress: true

jobs:
  generate:
    uses: ./.github/workflows/autotest-run.yml
    secrets: inherit
    with:
      extra_env: ${{ inputs.extra_env }}
