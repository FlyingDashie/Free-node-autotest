name: Free Node Autotest

on:
  repository_dispatch:
    types: [trigger-clash-generation]
  workflow_dispatch:
    inputs:
      extra_env:
        description: "Extra env vars, one KEY=VALUE per line"
        required: false
        default: ""
        type: string

# touch: re-register schedule
concurrency:
  group: 'autotest-clash'
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 115
    permissions:
      contents: write   # 需要写回仓库权限

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 确保能推送
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pyyaml urllib3 feedparser beautifulsoup4 py7zr rarfile pycryptodome
          sudo apt-get update
          sudo apt-get install -y p7zip-full unrar || sudo apt-get install -y p7zip-full py7zr

      - name: Apply extra env
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.extra_env != ''
        env:
          EXTRA_ENV: ${{ github.event.inputs.extra_env }}
        run: |
          python3 - <<'PY'
          import os
          text = os.environ.get("EXTRA_ENV") or ""
          path = os.environ["GITHUB_ENV"]
          with open(path, "a", encoding="utf-8") as fh:
              for raw in text.splitlines():
                  line = raw.strip()
                  if not line or line.startswith("#") or "=" not in line:
                      continue
                  key, _, val = line.partition("=")
                  key = key.strip()
                  if not key:
                      continue
                  fh.write(f"{key}={val}\n")
                  print(f"[INFO] extra env {key}")
          PY

      - name: Run generator and capture log
        id: run
        run: |
          mkdir -p output history
          RUN_DATE=$(date -u +%Y%m%d)
          RUN_HM=$(date -u +%H%M)
          RUN_TIME="$RUN_HM-$RUN_DATE"
          INV=$((999999999999 - 10#$RUN_DATE$RUN_HM))
          echo "RUN_TIME=$RUN_TIME" >> $GITHUB_ENV
          echo "INV=$INV" >> $GITHUB_ENV
          python -u generator-github.py 2>&1 | tee "history/"$INV"-log-"$RUN_TIME".log"
          if [ ! -f output/clash.yaml ]; then
            echo "生成失败，output/clash.yaml 不存在"
            exit 1
          fi
          
      - name: Prepare files
        run: |
          # 1. 覆盖仓库根目录的最新文件
          cp output/clash.yaml ./clash.yaml
          
          # 2. 备份本次生成的文件到 history 目录（按时间命名）
          cp output/clash.yaml "history/${INV}-clash-${RUN_TIME}.yaml"
          if [ -f output/raw.yaml ]; then
            cp output/raw.yaml "history/${INV}-raw-${RUN_TIME}.yaml"
          else
            echo "output/raw.yaml 不存在，本轮不写 raw 备份"
          fi
          
          # 2.5 旧文件名改成 INV-kind-HHMM-YYYYMMDD.ext
          python3 - <<'PY'
          from pathlib import Path
          import re

          hist = Path("history")
          target_re = re.compile(r"^\d+-(?:run|log|clash|raw)-\d{4}-20\d{6}\.(?:log|yaml)$")
          patterns = [
              re.compile(r"^(?P<inv>\d+)-(?P<date>20\d{6})-(?P<hm>\d{4})-(?P<kind>run|log|clash|raw)\.(?P<ext>log|yaml)$"),
              re.compile(r"^(?P<inv>\d+)-(?P<kind>run|log|clash|raw)-(?P<date>20\d{6})-(?P<hm>\d{4})\.(?P<ext>log|yaml)$"),
              re.compile(r"^(?P<kind>run|log|clash|raw)-(?P<date>20\d{6})-(?P<hm>\d{4})\.(?P<ext>log|yaml)$"),
          ]
          if hist.is_dir():
              for p in list(hist.iterdir()):
                  if not p.is_file() or target_re.match(p.name):
                      continue
                  parsed = None
                  for pat in patterns:
                      match = pat.match(p.name)
                      if match:
                          parsed = match.groupdict()
                          break
                  if not parsed:
                      print(f" skip unknown {p.name}")
                      continue
                  date, hm, kind, ext = parsed["date"], parsed["hm"], parsed["kind"], parsed["ext"]
                  inv = str(999999999999 - int(date + hm))
                  new_name = f"{inv}-{kind}-{hm}-{date}.{ext}"
                  dest = p.with_name(new_name)
                  if dest.exists() and dest.resolve() != p.resolve():
                      print(f" skip exists {p.name} -> {new_name}")
                      continue
                  p.rename(dest)
                  print(f" renamed {p.name} -> {new_name}")
          PY

          # 3. 清理超过 48 小时的历史文件（按文件名时间）
          python3 - <<'PY'
          from datetime import datetime, timedelta, timezone
          from pathlib import Path
          import re

          cutoff = datetime.now(timezone.utc) - timedelta(hours=48)
          hist = Path("history")
          removed = []

          def history_file_stamp(name):
              match = re.search(r"(\d{4})-(20\d{6})", name)
              if match:
                  return match.group(2) + match.group(1)
              match = re.search(r"(20\d{6})-(\d{4})", name)
              if match:
                  return match.group(1) + match.group(2)
              return ""

          if hist.is_dir():
              for p in hist.iterdir():
                  if not p.is_file():
                      continue
                  stamp = history_file_stamp(p.name)
                  if not stamp:
                      continue
                  try:
                      ts = datetime.strptime(stamp, "%Y%m%d%H%M").replace(tzinfo=timezone.utc)
                  except ValueError:
                      continue
                  if ts < cutoff:
                      p.unlink(missing_ok=True)
                      removed.append(p.name)
          print(f"cutoff_utc={cutoff.strftime('%Y%m%d-%H%M')} removed={len(removed)}")
          for name in sorted(removed):
              print(f" deleted {name}")
          PY
          
          echo "当前 history 目录内容："
          ls -lh history/ || true

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A clash.yaml history/

          if git diff --staged --quiet; then
            echo "没有文件变更，跳过提交"
          else
            git commit -m "Auto update clash.yaml + history ${RUN_TIME}"
            git pull --rebase origin main
            git push
          fi
