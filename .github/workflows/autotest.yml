name: Generate Clash Config

on:
  # 允许由外部定时平台（如 cron-job.org）触发
  repository_dispatch:
    types: [trigger-clash-generation]
  
  # 保留手动触发，方便调试
  workflow_dispatch:

# touch: re-register schedule
concurrency:
  group: 'autotest-clash'
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 115
    permissions:
      contents: write   # 需要写回仓库权限

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 确保能推送
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pyyaml urllib3 feedparser beautifulsoup4

      - name: Run generator and capture log
        id: run
        run: |
          mkdir -p output history
          # 记录运行时间（UTC）
          RUN_TIME=$(date -u +%Y%m%d-%H%M)
          INV=$((999999999999 - 10#$(date -u +%Y%m%d%H%M)))
          echo "RUN_TIME=${RUN_TIME}" >> $GITHUB_ENV
          echo "INV=${INV}" >> $GITHUB_ENV
          
          # 运行脚本并同时保存日志
          python generator-github.py 2>&1 | tee "history/${INV}-run-${RUN_TIME}.log"
          
          # 检查是否成功生成文件
          if [ ! -f output/clash.yaml ]; then
            echo "生成失败，output/clash.yaml 不存在"
            exit 1
          fi

      - name: Prepare files
        run: |
          # 1. 覆盖仓库根目录的最新文件
          cp output/clash.yaml ./clash.yaml
          
          # 2. 备份本次生成的文件到 history 目录（按时间命名）
          cp output/clash.yaml "history/${INV}-clash-${RUN_TIME}.yaml"
          if [ -f output/raw.yaml ]; then
            cp output/raw.yaml "history/${INV}-raw-${RUN_TIME}.yaml"
          else
            echo "output/raw.yaml 不存在，本轮不写 raw 备份"
          fi
          
          # 3. 清理超过 48 小时的历史文件（按文件名时间）
          python3 - <<'PY'
          from datetime import datetime, timedelta, timezone
          from pathlib import Path
          import re

          cutoff = datetime.now(timezone.utc) - timedelta(hours=48)
          pat = re.compile(r"(20\d{6})-(\d{4})")
          hist = Path("history")
          removed = []
          if hist.is_dir():
              for p in hist.iterdir():
                  if not p.is_file():
                      continue
                  m = pat.search(p.name)
                  if not m:
                      continue
                  try:
                      ts = datetime.strptime(m.group(1) + m.group(2), "%Y%m%d%H%M").replace(tzinfo=timezone.utc)
                  except ValueError:
                      continue
                  if ts < cutoff:
                      p.unlink(missing_ok=True)
                      removed.append(p.name)
          print(f"cutoff_utc={cutoff.strftime('%Y%m%d-%H%M')} removed={len(removed)}")
          for name in sorted(removed):
              print(f" deleted {name}")
          PY
          
          echo "当前 history 目录内容："
          ls -lh history/ || true

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A clash.yaml history/

          if git diff --staged --quiet; then
            echo "没有文件变更，跳过提交"
          else
            git commit -m "Auto update clash.yaml + history ${RUN_TIME}"
            git pull --rebase origin main
            git push
          fi
